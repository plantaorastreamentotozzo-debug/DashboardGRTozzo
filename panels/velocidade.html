<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">

<style>
:root{--bg:#FFFFFF;--card:#FFFFFF;--bd:#CFE0D5;--tx:#10241A;--mut:#587065;--am:#007D3A;--tl:#007D3A;--panel2:#EAF4EE;--accent:#007D3A;--lime:#C7D30A;--px:max(clamp(16px,4vw,40px),calc((100vw - 1180px)/2));box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:12px "Courier New",monospace;padding:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:flex-end}
label{display:block;color:var(--mut);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
select,input,button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:3px;padding:9px;font:inherit;min-width:130px}
button{cursor:pointer}button:hover{border-color:var(--mut)}button:disabled{opacity:.4;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:14px}
.card h3{margin:0 0 10px;font-size:10px;color:var(--mut);letter-spacing:.1em;font-weight:400;text-transform:uppercase}
.big{font-size:22px}.k1{border-color:#5a4210;background:#1a1405}.k1 .big{color:var(--am);font-size:32px}
.sub{color:var(--mut);font-size:10px;margin-top:10px}
.kpis .sub{font-size:15px;line-height:1.35;color:#9cc3ca;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px;margin-top:8px}
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;overflow-x:auto}
.b{flex:1;min-width:34px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:9px;color:var(--mut)}
.b i{display:block;width:100%;background:var(--am);margin:2px 0}
.rk{display:grid;grid-template-columns:minmax(90px,1.2fr) 2fr 64px;gap:8px;align-items:center;margin:7px 0;font-size:11px}
.rk .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8fb3ba}
.rk .t{background:#000;height:12px}.rk .t i{display:block;height:100%;background:var(--tl)}.rk.op .t i{background:var(--am)}
.rk .v{text-align:right}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);cursor:pointer;font-weight:400;text-transform:uppercase;font-size:10px}td.n,th.n{text-align:right}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}
#sr[aria-pressed=true]{border-color:var(--am);color:var(--am)}
#msg{color:var(--am);margin:6px 0}

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:1rem;line-height:1.4;padding:0 var(--px) 60px;background:#FFFFFF;color:var(--tx)}
body::before{content:"";display:block;height:12px;margin:0 calc(-1*var(--px)) 20px;background:linear-gradient(90deg,#052A18,#007D3A);border-bottom:4px solid var(--lime)}
.row{gap:8px;margin-bottom:16px}
label{font-size:.75rem;letter-spacing:0;text-transform:none;color:var(--mut);margin-bottom:3px}
select,input{background:#FFFFFF;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:.82rem;min-width:130px}
select:focus,input:focus{outline:2px solid var(--lime);border-color:var(--accent)}
button{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:7px 14px;font-size:.82rem;font-weight:400}
button:hover{border-color:var(--accent)}
#sr[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}

.kpis{gap:10px;margin:0 0 22px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.card{background:#FFFFFF;border:1px solid var(--bd);border-radius:8px;padding:12px 14px}
.kpis .card{border-top:3px solid var(--lime)}
.k1,.kpis .card.k1{background:#FFFFFF;border-color:var(--bd);border-top:3px solid var(--lime)}
.big,.k1 .big{font-size:1.5rem;font-weight:650;color:var(--tx)}
.k1 .big{color:var(--accent);font-size:1.5rem}
.card h3{font-size:.75rem;letter-spacing:0;text-transform:none;color:var(--mut);font-weight:400;margin:0 0 4px}
.sub,.kpis .sub{font-size:.75rem;line-height:1.4;color:var(--mut);margin-top:2px}
.grid{gap:16px;margin-top:16px}
.card[style]{margin-top:16px!important}
.bars{gap:6px}
.b{font-size:.75rem;color:var(--mut)}
.b i{background:var(--accent);border-radius:3px 3px 0 0}
.rk{grid-template-columns:110px 1fr 34px;gap:8px;font-size:.78rem;margin:7px 0}
.rk .n{color:var(--tx)}
.rk .t{background:var(--panel2);height:9px;border-radius:4px;overflow:hidden}
.rk .t i{background:var(--accent);border-radius:4px}
.rk.op .t i{background:var(--accent)}
.tw{border:1px solid var(--bd);border-radius:8px}
table{font-size:.8rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd)}
th{background:var(--panel2);color:var(--mut);font-weight:600;font-size:.8rem;text-transform:none}
tbody tr:hover td{background:var(--panel2)}
.pg{font-size:.8rem;color:var(--mut)}
.sel{min-width:150px}
details.map{margin:0 0 14px;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;background:#fff}
details.map summary{cursor:pointer;color:var(--accent);font-size:.82rem}
details.map .row{margin:10px 0 2px}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 22px}
.hl .card{border-top:3px solid var(--lime)}
.hl .card.k1{border-left:4px solid var(--accent)}
.up{color:#C62828;font-weight:600}.dn{color:#2E7D4F;font-weight:600}
.rk3{display:grid;grid-template-columns:22px minmax(140px,2fr) minmax(40px,1fr) 52px 46px;gap:8px;align-items:center;margin:7px 0;font-size:.78rem;cursor:pointer;padding:2px 4px;border-radius:5px}
.rk3:hover{background:var(--panel2)}.rk3.on{background:rgba(11,94,59,.14);outline:1px solid var(--accent)}
.rk3 .n{overflow:hidden;white-space:normal;line-height:1.2;overflow-wrap:anywhere}
.rk3 .t{background:var(--panel2);height:9px;border-radius:4px;overflow:hidden}.rk3 .t i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rk3 .v,.rk3 .p{text-align:right}.rk3 .pos{color:var(--mut)}
.rk3 small{display:block;color:var(--mut);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead{display:grid;grid-template-columns:22px minmax(140px,2fr) minmax(40px,1fr) 52px 46px;gap:8px;font-size:.72rem;color:var(--mut);margin-bottom:4px;padding:0 4px}
.chead span:nth-child(4),.chead span:nth-child(5){text-align:right}
.conc{font-size:.8rem;color:var(--mut);margin-top:10px;line-height:1.5}

.kpis .card.clk{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.kpis .card.clk:hover{border-color:var(--accent)}
.kpis .card.clk:focus-visible{outline:2px solid var(--lime)}
.kpis .card.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,125,58,.25)}
.kpis .card .hint{font-size:.7rem;color:var(--mut);margin-top:2px}

</head><body>
<div class="row">
 <div><label>Data inicial</label><input type="date" id="di"></div>
 <div><label>Data final</label><input type="date" id="df"></div>
 <div><label>Motorista</label><select id="so" class="sel"></select></div>
 <div><label>Faixa de velocidade</label><select id="sv" class="sel"></select></div>
 <div><label>Localização</label><select id="sl" class="sel"></select></div>
 <div><label>Buscar</label><input id="q" placeholder="Digite o nome do motorista"></div>
 <button id="clr">Limpar filtros</button>
 <button id="rf">⟳ Atualizar</button>
</div>
<div id="msg"></div>
<div class="hl" id="hl"></div>
<div class="grid" id="gr"></div>
<div class="card" style="margin-top:16px"><h3 id="hEv">Evolução</h3><div class="bars" id="cm"></div></div>
<script>
const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('pt-BR'),pf=p=>p.toFixed(1).replace('.',',')+'%';
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mlab=k=>k?MESES[+k.slice(5)-1]+'/'+k.slice(0,4):'—';
const br=iso=>iso?iso.split('-').reverse().join('/'):'';
/* ---------- leitura de CSV (sem biblioteca externa) ---------- */
const FAIXAS=['Até 80 km/h','81 a 85 km/h','86 a 95 km/h','96 a 101 km/h','102 km/h ou mais'];
const faixa=v=>v<=80?FAIXAS[0]:v<=85?FAIXAS[1]:v<=95?FAIXAS[2]:v<=101?FAIXAS[3]:FAIXAS[4];
function parseCsv(t){
  const out=[];let row=[],cur='',q=false;t=String(t).replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';out.push(row);row=[]}
    else cur+=ch}
  if(cur!==''||row.length){row.push(cur);out.push(row)}
  return out.filter(r=>r.some(c=>String(c).trim()!==''));
}
const okD=(y,m,d)=>y>=2020&&y<=2035&&m>=1&&m<=12&&d>=1&&d<=31;
const num=v=>{const s=String(v==null?'':v).replace(/[^\d,.-]/g,'');if(!s)return NaN;return parseFloat(s.indexOf(',')>-1?s.replace(/\./g,'').replace(',','.'):s)};
function parseDate(v){ // 'AAAA-MM-DD' ('AAAA-MM-01' se só houver mês/ano); '' se inválida
  const s=String(v==null?'':v).trim();if(!s)return '';let m;
  const R=(y,mo,d)=>okD(+y,+mo,+d)?y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'):'';
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?!\d)/)))return R(m[3],m[2],m[1]);
  if((m=s.match(/^(\d{1,2})\/(\d{2})(\d{4})(?!\d)/)))return R(m[3],m[2],m[1]);      // digitação "28/092025"
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})(?!\d)/)))return R('20'+m[3],m[2],m[1]);
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return R(m[1],m[2],m[3]);
  if((m=s.match(/^(\d{4})-(\d{1,2})$/)))return R(m[1],m[2],1);
  if((m=s.match(/^(\d{1,2})\/(\d{4})$/)))return R(m[2],m[1],1);
  return '';
}

/* A planilha tem: A Placa · B Data/Hora · C Localização · D Velocidade Excedida (Km/h) · E Motorista · F CPF.
   Só a DATA (dia/mês/ano) é usada; o horário é ignorado. Colunas achadas pelo nome do cabeçalho; se não achar, usa a letra indicada. */
let ROWS=[],MIN='',MAX='',SEMDATA=0,ERR='',TODOS=false;
function load(text){
  const a=parseCsv(text);if(a.length<2)throw new Error('A planilha não tem linhas de dados.');
  const H=a[0].map(x=>norm(x));
  const ix=(re,d)=>{const j=H.findIndex(h=>re.test(h));return j<0?d:j};
  const cD=ix(/^data/,1),cV=ix(/^velocidade/,3),cM=ix(/^motorista/,4),cL=ix(/^localiza/,2);
  const out=[];SEMDATA=0;let semMot=0,semVel=0;
  a.slice(1).forEach(r=>{
    const mot=String(r[cM]==null?'':r[cM]).replace(/\s+/g,' ').trim();
    if(!mot||mot==='-'){semMot++;return}                         // linha sem motorista não é contada
    const v=num(r[cV]);if(isNaN(v)){semVel++;return}
    const d=parseDate(r[cD]);if(!d)SEMDATA++;
    out.push({d,m:d?d.slice(0,7):'',o:mot,v,f:faixa(v),l:String(r[cL]==null?'':r[cL]).replace(/\s+/g,' ').trim()||'(não informada)'});
  });
  ROWS=out;const ds=out.map(r=>r.d).filter(Boolean).sort();MIN=ds[0]||'';MAX=ds[ds.length-1]||'';
  const kv=['di','df','so','sv','sl','q'].map(i=>$(i).value);
  $('di').min=$('df').min=MIN;$('di').max=$('df').max=MAX;$('di').value=MIN;$('df').value=MAX;
  const cnt=k=>{const m=new Map();out.forEach(r=>m.set(r[k],(m.get(r[k])||0)+1));return [...m]};
  const opts=(el,arr,all)=>el.innerHTML='<option value="">'+all+'</option>'+arr.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
  opts($('so'),cnt('o').map(x=>x[0]).sort((x,y)=>x.localeCompare(y,'pt-BR')),'Todos');
  opts($('sv'),FAIXAS.filter(f=>out.some(r=>r.f===f)),'Todas');
  opts($('sl'),cnt('l').map(x=>x[0]).sort((x,y)=>x.localeCompare(y,'pt-BR')),'Todas');
  ['di','df','so','sv','sl','q'].forEach((i,n)=>{if(!kv[n]||!ROWS.length)return;$(i).value=kv[n];if(i!=='q'&&$(i).value!==kv[n])$(i).value=(i==='di'?MIN:i==='df'?MAX:'')});
  draw();
  if(SEMDATA||semMot||semVel)console.info('[Tozzo] Velocidade: '+SEMDATA+' sem data válida (fora do filtro de período), '+semMot+' sem motorista e '+semVel+' sem velocidade (não contadas)');
}
function range(){let a=$('di').value||MIN,b=$('df').value||MAX;if(a>b){const t=a;a=b;b=t}return [a,b]}
function view(){
  const [a,b]=range(),full=(a===MIN&&b===MAX),so=$('so').value,sv=$('sv').value,sl=$('sl').value,q=norm($('q').value);
  return ROWS.filter(r=>(r.d?(r.d>=a&&r.d<=b):full)&&(!so||r.o===so)&&(!sv||r.f===sv||String(r.v)===sv)&&(!sl||r.l===sl)&&(!q||norm(r.o+' '+r.l).includes(q)));
}
function agg(rows,k){const m=new Map();rows.forEach(r=>m.set(r[k],(m.get(r[k])||0)+1));return [...m].sort((x,y)=>y[1]-x[1]||String(x[0]).localeCompare(String(y[0]),'pt-BR'))}
const card=(h,big,sub,k,v,on)=>'<div class="card'+(k?' clk':'')+(on?' on':'')+'"'+(k?' role="button" tabindex="0" data-ck="'+k+'" data-cv="'+esc(v)+'" title="Clique para filtrar as telas abaixo"':'')+'><h3>'+h+'</h3><div class="big" style="font-size:1.15rem;overflow-wrap:anywhere">'+big+'</div><div class="sub">'+sub+'</div></div>';
function rows3(L,tot,key,cur,n,suf){
  const mx=L.length?L[0][1]:1;
  return L.slice(0,n).map(([nm,v],i)=>'<div class="rk3'+(String(nm)===cur?' on':'')+'" data-'+key+'="'+esc(nm)+'" title="Clique para filtrar"><span class="pos">'+(i+1)+'</span><span class="n" title="'+esc(nm)+'">'+esc(nm)+(suf||'')+'</span><span class="t"><i style="width:'+v/mx*100+'%"></i></span><span class="v">'+fmt(v)+'</span><span class="p">'+pf(tot?v/tot*100:0)+'</span></div>').join('')||'<div class="sub">Sem dados para esta seleção</div>';
}
const head3=l=>'<div class="chead"><span>#</span><span>'+l+'</span><span></span><span>Qtd</span><span>%</span></div>';
const mR=k=>{const y=+k.slice(0,4),m=+k.slice(5,7),f=k+'-01',l=k+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');return [f<MIN?MIN:f,l>MAX?MAX:l]};
function draw(){
  const V=view(),tot=V.length;
  const O=agg(V,'o'),Vl=agg(V,'f').sort((x,y)=>FAIXAS.indexOf(x[0])-FAIXAS.indexOf(y[0])),L=agg(V,'l'),M=agg(V,'m').filter(x=>x[0]).sort((x,y)=>x[0].localeCompare(y[0]));
  const oT=O.find(x=>x[0].charAt(0)!=='(');
  const mx=V.length?V.reduce((b,r)=>r.v>b.v?r:b,V[0]):null;
  const topM=M.length?M.reduce((a,b)=>b[1]>a[1]?b:a):null;
  const [a,b]=range(),a2=MIN?(a<MIN?MIN:a):'',b2=MIN?(b>MAX?MAX:b):'';
  const mOn=topM&&(()=>{const r=mR(topM[0]);return a2===r[0]&&b2===r[1]})();
  const qt=n=>fmt(n)+(n===1?' ocorrência':' ocorrências');
  $('hl').innerHTML=
    card('Maior ofensor · Motorista',oT?esc(oT[0]):'—',oT?qt(oT[1]):'',oT?'o':'',oT?oT[0]:'',oT&&$('so').value===oT[0])
   +card('Maior velocidade excedida atingida',mx?fmt(mx.v)+' km/h':'—',mx?esc(mx.o):'',mx?'v':'',mx?String(mx.v):'',mx&&$('sv').value===String(mx.v))
   +card('Mês com mais velocidade excedida',topM?mlab(topM[0]):'—',topM?qt(topM[1]):(MIN?'':'sem data na base'),topM?'m':'',topM?topM[0]:'',!!mOn);
  const t3=O.slice(0,3).reduce((s,x)=>s+x[1],0),t10=O.slice(0,10).reduce((s,x)=>s+x[1],0),nO=TODOS?O.length:10;
  $('gr').innerHTML=
    '<div class="card"><h3>Motoristas · quantidade e participação (%)</h3>'+head3('Motorista')+'<div>'+rows3(O,tot,'o',$('so').value,nO)+'</div>'
     +(O.length>10?'<button type="button" id="tg" style="margin-top:8px">'+(TODOS?'Mostrar só os 10 primeiros':'Mostrar todos ('+fmt(O.length)+')')+'</button>':'')
     +'<div class="conc">'+(O.length?'Concentração: os 3 primeiros reúnem '+pf(t3/tot*100)+' das ocorrências e os 10 primeiros '+pf(t10/tot*100)+' (de '+fmt(O.length)+' motoristas).':'')+'</div></div>'
   +'<div class="card"><h3>Faixas de velocidade · quantidade e participação (%)</h3>'+head3('Faixa')+'<div>'+rows3(Vl,tot,'f',$('sv').value,10)+'</div></div>'
   +'<div class="card"><h3>Localizações · quantidade e participação (%)</h3>'+head3('Localização')+'<div>'+rows3(L,tot,'l',$('sl').value,10)+'</div></div>';
  // evolução sempre por mês (mês/ano)
  const MN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const E=M.slice().sort((x,y)=>x[0].localeCompare(y[0])),mxE=Math.max(1,...E.map(x=>x[1]));
  $('hEv').textContent='Evolução por mês';
  $('cm').innerHTML=E.length?E.map(([k,v])=>'<div class="b">'+fmt(v)+'<i style="height:'+Math.max(2,v/mxE*140)+'px"></i>'+MN[+k.slice(5,7)-1]+'/'+k.slice(0,4)+'</div>').join(''):'<div class="sub">Sem datas na base: a evolução não pode ser calculada.</div>';
  const tg=$('tg');if(tg)tg.onclick=()=>{TODOS=!TODOS;draw()};
}
function cardClick(a){
  const k=a.dataset.ck,n=a.dataset.cv;
  if(k==='m'){const [f,l]=mR(n);if($('di').value===f&&$('df').value===l){$('di').value=MIN;$('df').value=MAX}else{$('di').value=f;$('df').value=l}draw();return}
  const id={o:'so',v:'sv',l:'sl'}[k];if(k==='v'&&![...$(id).options].some(o=>o.value===n)){const op=document.createElement('option');op.value=n;op.textContent=n+' km/h';$(id).appendChild(op)}$(id).value=($(id).value===n)?'':n;draw();
}
document.addEventListener('click',e=>{
  const cd=e.target.closest('[data-ck]');if(cd){cardClick(cd);return}
  for(const [k,id] of [['o','so'],['f','sv'],['l','sl']]){const a=e.target.closest('[data-'+k+']');if(a){const n=a.dataset[k];$(id).value=($(id).value===n)?'':n;draw();return}}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-ck]')){e.preventDefault();cardClick(e.target)}});
['di','df','so','sv','sl'].forEach(i=>$(i).onchange=draw);
let tq;$('q').oninput=()=>{clearTimeout(tq);tq=setTimeout(draw,200)};
$('clr').onclick=()=>{if(!ROWS.length)return;$('di').value=MIN;$('df').value=MAX;['so','sv','sl','q'].forEach(i=>$(i).value='');draw()};
$('rf').onclick=()=>TozzoData.reload('velocidade');
let VER=0;
/* Para a Página Inicial e para a aba Ranking (somente leitura) */
window.TozzoResumo=function(ini,fim){
  if(!ROWS.length)return{pronto:false};
  const rows=ROWS.filter(r=>!r.d||((!ini||r.d>=ini)&&(!fim||r.d<=fim)));
  const O=agg(rows,'o').find(x=>x[0].charAt(0)!=='(');
  return{pronto:true,vazio:!O,nome:O?O[0]:'',valor:O?O[1]:0,total:rows.length,min:MIN,max:MAX,nota:'maior ofensor'};
};
window.TozzoPessoas=function(v){
  if(!ROWS.length)return{pronto:false};if(v===VER)return{pronto:true,same:true,ver:VER};
  return{pronto:true,ver:VER,motorista:ROWS.map(r=>({n:r.o,d:r.d,w:1}))};
};
TozzoData.start('velocidade',{required:['data','velocidade','motorista'],onData:function(text){load(text);VER++}});
</script></body></html>
