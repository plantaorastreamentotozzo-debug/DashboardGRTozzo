<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Diagnóstico das fontes | Esquadrão Tozzo</title>
<link rel="icon" href="assets/logo.png">
<style>
/* Página técnica, fora do menu. Só lê as fontes de js/config.js e mostra o que cada uma devolve. */
:root{--g:#0B5E3B;--g2:#2E7D4F;--soft:#A8D6A7;--light:#EAF5EF;--text:#1F2A24;--muted:#6B7A72;--line:#DCE8E0;--bad:#C62828;--warn:#B7791F;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);padding:24px 16px 60px;line-height:1.5}
main{max-width:1100px;margin:0 auto}
h1{margin:0 0 4px;color:var(--g);font-size:1.4rem}
p.sub{margin:0 0 18px;color:var(--muted);font-size:.9rem}
button{font:inherit;font-weight:600;font-size:.85rem;color:#fff;background:var(--g);border:1px solid var(--g);border-radius:10px;padding:9px 18px;cursor:pointer}
button:hover{background:var(--g2)}
section{border:1px solid var(--line);border-radius:14px;margin:18px 0;overflow:hidden}
section h2{margin:0;padding:12px 16px;background:var(--light);color:var(--g);font-size:1rem}
.row{padding:12px 16px;border-top:1px solid var(--line);font-size:.85rem}
.row .t{font-weight:600}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.72rem;font-weight:600;margin-left:6px;border:1px solid var(--soft);background:var(--light);color:var(--g)}
.tag.cand{border-color:#E0C27A;background:#FBF3DC;color:var(--warn)}
.ok{color:var(--g2);font-weight:600}.bad{color:var(--bad);font-weight:600}
code{display:block;margin-top:6px;word-break:break-all;font-size:.74rem;color:var(--muted)}
.hdr{margin-top:6px;font-size:.78rem;overflow-x:auto;white-space:nowrap;background:#F7FAF8;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
</style>
</head>
<body>
<main>
  <h1>Diagnóstico das fontes de dados</h1>
  <p class="sub">Lê as URLs de <b>js/config.js</b> e mostra, para cada fonte, o cabeçalho, a quantidade de linhas e as datas mais antiga e mais recente encontradas. Use para comparar fontes (por exemplo, as duas de Câmeras) e conferir a aba lida.</p>
  <button id="go">Executar diagnóstico</button>
  <div id="out"></div>
</main>
<script src="js/config.js"></script>
<script>
(function () {
  var CFG = window.TOZZO_CONFIG || {}, out = document.getElementById('out');
  var NOMES = { cameras: 'Alertas Câmeras', sensores: 'Problema em Sensores', financeiro: 'Dashboard Financeiro', alertasgr: 'Alertas GR' };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function datas(t) {
    var re = /(\d{4})-(\d{2})-(\d{2})|(\d{1,2})\/(\d{1,2})\/(\d{4})/g, m, mn = '', mx = '', n = 0;
    while ((m = re.exec(t))) {
      var d = m[1] ? m[1] + '-' + m[2] + '-' + m[3] : m[6] + '-' + ('0' + m[5]).slice(-2) + '-' + ('0' + m[4]).slice(-2);
      if (!mn || d < mn) mn = d; if (!mx || d > mx) mx = d; n++;
    }
    var br = function (x) { return x ? x.split('-').reverse().join('/') : '—'; };
    return n ? br(mn) + ' a ' + br(mx) : 'nenhuma data encontrada';
  }
  async function testa(url) {
    var t0 = Date.now();
    try {
      var r = await fetch(url + (url.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
      var txt = await r.text(), ms = Date.now() - t0;
      if (!r.ok) return { ok: false, msg: 'HTTP ' + r.status };
      if (/^\s*</.test(txt)) return { ok: false, msg: 'Devolveu uma página HTML em vez de CSV' };
      if (/^\s*ERRO:/i.test(txt)) return { ok: false, msg: txt.slice(0, 200) };
      var linhas = txt.split(/\r?\n/).filter(function (l) { return l.trim(); });
      return { ok: true, linhas: linhas.length - 1, cab: linhas[0] || '', datas: datas(txt), ms: ms, kb: Math.round(txt.length / 1024) };
    } catch (e) { return { ok: false, msg: 'Falha de conexão (' + e.message + ')' }; }
  }
  async function run() {
    out.innerHTML = '<p class="sub">Consultando as fontes…</p>';
    var html = '';
    for (var k in NOMES) {
      var itens = [];
      if (CFG.API_URL) itens.push({ r: 'Apps Script', tag: 'principal', url: CFG.API_URL + '?s=' + encodeURIComponent((CFG.SOURCES || {})[k] || k) });
      ((CFG.FALLBACK_CSV_URLS || {})[k] || []).forEach(function (u, i) { itens.push({ r: 'CSV publicado #' + (i + 1), tag: 'reserva (ativa)', url: u }); });
      ((CFG.CANDIDATE_CSV_URLS || {})[k] || []).forEach(function (u, i) { itens.push({ r: 'CSV candidato #' + (i + 1), tag: 'não usada · apenas comparação', url: u, cand: 1 }); });
      html += '<section><h2>' + NOMES[k] + '</h2>';
      for (var i = 0; i < itens.length; i++) {
        var it = itens[i], r = await testa(it.url);
        html += '<div class="row"><span class="t">' + esc(it.r) + '</span><span class="tag' + (it.cand ? ' cand' : '') + '">' + esc(it.tag) + '</span> ';
        if (r.ok) html += '<span class="ok">respondeu</span> · ' + r.linhas.toLocaleString('pt-BR') + ' linhas · datas: ' + esc(r.datas) + ' · ' + r.kb + ' KB · ' + r.ms + ' ms<div class="hdr">' + esc(r.cab) + '</div>';
        else html += '<span class="bad">' + esc(r.msg) + '</span>';
        html += '<code>' + esc(it.url) + '</code></div>';
      }
      html += '</section>';
    }
    out.innerHTML = html;
  }
  document.getElementById('go').onclick = run;
})();
</script>
</body>
</html>
